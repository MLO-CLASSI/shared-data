[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrograph-shared-data"
version = "0.0.1"
description = "Shared/common data files for the MLO spectrograph software"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["shared_data"]
package-dir = {shared_data = "."}
include-package-data = true

[tool.setuptools.package-data]
shared_data = ["csv_files/*.csv", "reference_spectra/*"]
